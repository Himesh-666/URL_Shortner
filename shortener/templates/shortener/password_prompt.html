<!DOCTYPE html>
<html lang="en">
<head>
    <title>Unlock link</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{
            background: linear-gradient(135deg,#0f172a,#4f46e5);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
        }
        .card{
            padding:28px;
            border-radius:18px;
            box-shadow:0px 18px 50px rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);
            color: #fff;
        }
        .muted{ color: rgba(255,255,255,0.75); }
        input{ background: rgba(255,255,255,0.9); }
    </style>
</head>
<body>

<div class="card col-md-6 col-lg-5">
    <h2 class="text-center">🔒 Password required</h2>
    <div class="text-center muted mt-2">Enter the password to access this shortened link.</div>

    {% if error %}
    <div class="alert alert-danger mt-3" role="alert">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" class="mt-4">
        {% csrf_token %}
        <input
            type="password"
            name="password"
            class="form-control"
            placeholder="Password"
            required
        >
        <div class="d-grid mt-3">
            <button class="btn btn-primary btn-lg" type="submit">Unlock</button>
        </div>
    </form>

    <div class="text-center muted mt-3">
        Short code: <span class="text-white">{{ short_code }}</span>
    </div>

    <div class="text-center mt-3">
        <a href="/" class="btn btn-sm btn-outline-light">Back</a>
    </div>
</div>

</body>
</html>
