<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unlock link</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'shortener/css/site.css' %}">
</head>
<body class="page-unlock">
<div class="wrap">
    <div class="card">
        <div class="card-inner">
            <div class="lock-row">
                <div class="lock-mark" aria-hidden="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                        <path d="M6 11h12v10H6V11z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>
            <h1>Password required</h1>
            <p class="lede">Enter the password to open this shortened link.</p>

            {% if error %}
            <div class="banner-error" role="alert">{{ error }}</div>
            {% endif %}

            <form method="POST" action="">
                {% csrf_token %}
                <label class="field-label" for="unlock-password">Password</label>
                <input
                    id="unlock-password"
                    type="password"
                    name="password"
                    class="ctrl"
                    placeholder="Password"
                    required
                    autocomplete="current-password"
                />
                <button class="submit-btn" type="submit">
                    Unlock link
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>

            <p class="meta">Short code <code>{{ short_code }}</code></p>

            <div class="back">
                <a href="/">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Back to home
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
