<!DOCTYPE html>
<html lang="en">
<head>
    <title>Link expired</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{
            background: linear-gradient(135deg,#0f172a,#4f46e5);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
        }
        .card{
            padding:28px;
            border-radius:18px;
            box-shadow:0px 18px 50px rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);
            color: #fff;
        }
        .muted{ color: rgba(255,255,255,0.75); }
    </style>
</head>
<body>

<div class="card col-md-6 col-lg-5 text-center">
    <h2>⏳ Link expired</h2>
    <div class="muted mt-2">This shortened link is no longer valid.</div>
    <div class="muted mt-2">Short code: <span class="text-white">{{ short_code }}</span></div>
    <div class="mt-4">
        <a href="/" class="btn btn-outline-light">Create a new one</a>
    </div>
</div>

</body>
</html>
