<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Call limit reached</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'shortener/css/site.css' %}">
</head>
<body class="page-unlock">
<div class="wrap">
    <div class="card">
        <div class="card-inner">
            <h1>Call limit reached</h1>
            <p class="lede">This shortened link has no remaining visits.</p>
            <p class="meta">Short code <code>{{ short_code }}</code></p>
            <div class="back">
                <a href="/">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Create a new link
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
